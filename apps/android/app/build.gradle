apply plugin: 'com.android.application'

def requestedCode = System.getenv('OPENPOS_ANDROID_VERSION_CODE') ?: '1'
def requestedName = System.getenv('OPENPOS_ANDROID_VERSION_NAME') ?: '0.1.0'
if (!(requestedCode ==~ /[1-9][0-9]{0,9}/) || requestedCode.toLong() > 2100000000L) throw new GradleException('OPENPOS_ANDROID_VERSION_CODE must be an integer from 1 to 2100000000.')
if (!(requestedName ==~ /[0-9A-Za-z][0-9A-Za-z.+_-]{0,49}/)) throw new GradleException('OPENPOS_ANDROID_VERSION_NAME must be a short version label.')
def signRelease = project.findProperty('openposSigned') == 'true'
def signingVariables = ['OPENPOS_ANDROID_KEYSTORE', 'OPENPOS_ANDROID_STORE_PASSWORD', 'OPENPOS_ANDROID_KEY_ALIAS', 'OPENPOS_ANDROID_KEY_PASSWORD']
if (signRelease && signingVariables.any { !System.getenv(it) }) throw new GradleException('Signed bundles require all four OPENPOS_ANDROID signing environment variables. No signing key is generated automatically.')

android {
    namespace = 'org.openpos.mobile'
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = '36.0.0'
    defaultConfig {
        applicationId 'org.openpos.mobile'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode requestedCode.toInteger()
        versionName requestedName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions { ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' }
    }
    signingConfigs {
        if (signRelease) {
            upload {
                storeFile file(System.getenv('OPENPOS_ANDROID_KEYSTORE'))
                storePassword System.getenv('OPENPOS_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('OPENPOS_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('OPENPOS_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Omission intentionally produces an unsigned AAB; there is no debug-key fallback.
            if (signRelease) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
repositories { flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
apply from: 'capacitor.build.gradle'
