name: Build and verify Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the default, which includes the obsolete "tools" package.
          packages: platform-tools
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn android:sync
      - run: yarn test:android
      # Public PR builds receive no Play credentials or upload signing key.
      - run: node scripts/android.cjs bundle
      - run: node scripts/android.cjs apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPOS-Android-unsigned-bundle-and-debug-apk
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-test-diagnostics
          path: apps/android/app/build/reports/
